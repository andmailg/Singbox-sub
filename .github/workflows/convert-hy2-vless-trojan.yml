name: Auto Convert Xray to Sing-Box

on:
  schedule:
    # Запуск каждые 5 часов
    - cron: '0 */5 * * *'
  workflow_dispatch: # Ручной запуск

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests maxminddb

      - name: Run scripts
        run: |
          python Python/mobile-hy2.py
          python Python/mobile-vless-http.py
          python Python/mobile-trojan.py
          python Python/router.py

      - name: Commit and push if changed
        run: |
          # 1. Настройка бота GitHub Actions
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 2. Добавляем файл в индекс
          git add sing-box-hy2.json sing-box-vless-http.json sing-box-trojan.json router.json
          git status
          
          # 3. Коммитим и пушим только при наличии изменений
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "Auto-update sing-box-hy2.json & sing-box-vless-http.json & sing-box-torjan.json & router.json"
            git push
          fi
