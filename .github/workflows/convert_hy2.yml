name: Auto Convert Xray to Sing-Box (HY2)

on:
  schedule:
    # Запуск каждые 5 часа (в 00:00, 05:00, 10:00, 15:00 UTC и т.д.)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Позволяет запускать конвертацию вручную одной кнопкой

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests maxminddb

      - name: Run scripts
        run: |
          python Python/hy2_parser.py
          
      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add sing-box-hy2.json
          git status
          # Проверяем наличие изменений в индексе (универсальный способ для всех добавленных файлов)
          git diff --cached --quiet || (git commit -m "Auto-update sing-box-hy2.json" && git push)
