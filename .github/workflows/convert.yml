name: Auto Convert Xray to Sing-Box

on:
  schedule:
    # Запуск каждые 5 часа (в 00:00, 05:00, 10:00, 15:00 UTC и т.д.)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Позволяет запускать конвертацию вручную одной кнопкой

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scripts
        env:
          XRAY_SUBSCRIPTION_URL: ${{ secrets.XRAY_SUBSCRIPTION_URL_BLACK_SS_ALL_RUS }}
        run: |
          python Python/mobile.py
          python Python/router.py
          
      - name: Run scripts
        env:
          XRAY_SUBSCRIPTION_URL: ${{ secrets.XRAY_SUBSCRIPTION_URL_Vless_Reality_White_Lists_Rus_Mobile }}
        run: |
          python Python/mobile_white.py
      
      - name: Run scripts
        env:
          XRAY_SUBSCRIPTION_URL: ${{ secrets.XRAY_SUBSCRIPTION_URL_EPODONIOS_ALL_CONFIGS_SUB }}
        run: |
          python Python/mobile_epodonios.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add sing-box.json config.json sing-box-white.json sing-box-epodonios.json
          git status
          # Проверяем наличие изменений в индексе (универсальный способ для всех добавленных файлов)
          git diff --cached --quiet || (git commit -m "Auto-update sing-box and router subscriptions and sing-box-white and sing-box-epodonios.json" && git push)
